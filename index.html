/* Draw safety trend */
function drawSafeTrendChart(){
  var cv=document.getElementById('safeTrendChart');if(!cv)return;
  var W=cv.width,H2=cv.height,pL=50,pR=15,pT=15,pB=45,cW=W-pL-pR,cH=H2-pT-pB;
  var ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H2);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H2);
  var data=[];
  for(var i=0;i<safeInps.length;i++){
    var si=safeInps[i];
    var sat=0,tot=0;
    var items=si.items||[];
    for(var j=0;j<items.length;j++){tot++;if(items[j].status==='Satisfactory')sat++}
    if(tot>0)data.push({date:si.date,score:Math.round(sat/tot*100)});
  }
  if(!data.length)return;
  var maxV=100;
  /* Grid */
  for(var g=0;g<=4;g++){
    var y=pT+cH-cH*(g/4);
    ctx.strokeStyle='#ece9e3';ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='9px JetBrains Mono';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(g*25+'%',pL-6,y);
  }
  /* Line */
  ctx.strokeStyle='#2d8a32';ctx.lineWidth=2;ctx.beginPath();
  for(var i=0;i<data.length;i++){
    var x=pL+i*(cW/(data.length-1||1));
    var y2=pT+cH-data[i].score/100*cH;
    if(i===0)ctx.moveTo(x,y2);else ctx.lineTo(x,y2);
  }
  ctx.stroke();
  /* Dots */
  for(var i=0;i<data.length;i++){
    var x=pL+i*(cW/(data.length-1||1));
    var y2=pT+cH-data[i].score/100*cH;
    var col=data[i].score>=80?'#2d8a32':data[i].score>=50?'#d4930d':'#cc3333';
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y2,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(data[i].score+'%',x,y2-7);
    /* Date label */
    ctx.save();ctx.translate(x,pT+cH+8);ctx.rotate(-0.5);
    ctx.fillStyle='#999';ctx.font='7px JetBrains Mono';ctx.textAlign='right';
    ctx.fillText(data[i].date.length>5?data[i].date.substring(5):data[i].date,0,0);
    ctx.restore();
  }
}

/* Save safety inspection */
function saveSafeInsp(){
ensureSafeInps();
var date=$('siDate').value;
var area=$('siArea').value.trim();
var inspector=$('siInsp').value.trim();
if(!inspector)return;
var contractor=$('siCont').value.trim();
var remarks=$('siRm').value.trim();

var items=[];
var sat=0,ni=0,unsat=0;
for(var c=0;c<safeCategories.length;c++){
  for(var i=0;i<safeCategories[c].items.length;i++){
    var el=document.getElementById('si_'+c+'_'+i);
    if(!el)continue;
    var st=el.value;
    items.push({category:safeCategories[c].cat,item:safeCategories[c].items[i],status:st});
    if(st==='Satisfactory')sat++;
    else if(st==='Needs Improvement')ni++;
    else if(st==='Unsatisfactory')unsat++;
  }
}
var total=sat+ni+unsat;
var overall='Satisfactory';
if(total>0){
  var satPct=sat/total*100;
  if(satPct>=80)overall='Satisfactory';
  else if(satPct>=50)overall='Needs Improvement';
  else overall='Unsatisfactory';
}

S.safetyInspections.unshift({
  id:Date.now(),
  date:date,
  area:area,
  inspector:inspector,
  contractor:contractor,
  remarks:remarks,
  items:items,
  overall:overall,
  satCount:sat,
  niCount:ni,
  unsatCount:unsat
});
save();mC();notify('Safety inspection submitted');doRender();
}

var selectedInps=[];

function ensureInps(){
  /* Convert object to array if Firebase broke it */
  if(S.inspections&&!Array.isArray(S.inspections)){
    var arr=[];
    for(var k in S.inspections){if(S.inspections[k])arr.push(S.inspections[k])}
    S.inspections=arr;
  }
  if(!Array.isArray(S.inspections))S.inspections=[];
  /* Filter out deleted items */
  var clean=[];
  for(var i=0;i<S.inspections.length;i++){
    var ins=S.inspections[i];if(!ins)continue;
    var did=ins.id||('d_'+Date.now()+'_'+i);
    if(deletedInspIds.indexOf(did)>=0)continue;
    clean.push(ins);
  }
  S.inspections=clean;
  /* Dedupe by ID only */
  if(!inspReady){
    var seen={},deduped=[];
    for(var i=0;i<S.inspections.length;i++){
      var ins2=S.inspections[i];
      var id=ins2.id;
      if(!id){ins2.id=Date.now()+i;id=ins2.id}
      if(!seen[id]){seen[id]=1;deduped.push(ins2)}
    }
    S.inspections=deduped;
    inspReady=true;
  }
}

/* --- Real-time listener for Power Automate sync --- */
function startInspSync(){
  if(!db)return;
  try{var _d=localStorage.getItem('ss_del_insp');if(_d)deletedInspIds=JSON.parse(_d)}catch(e){}
  try{
    db.ref('ss/inspectionsSync').on('value',function(snap){
      var val=snap.val();
      if(!val)return;
      ensureInps();
      var existMap={};
      for(var i=0;i<S.inspections.length;i++){
        existMap[S.inspections[i].id]=true;
      }
      var added=0;
      for(var key in val){
        if(!val[key]||typeof val[key]!=='object')continue;
        var item=val[key];
        if(!item.id)item.id='sync_'+key;
        if(existMap[item.id])continue;
        if(deletedInspIds.indexOf(item.id)>=0)continue;
        S.inspections.push(item);
        existMap[item.id]=true;
        added++;
      }
      if(added){
        inspReady=false;
        save();
        notify(added+' new inspection(s) synced');
        if(tab==='insp')doRender();
      }
    });
  }catch(e){console.log('Sync err:',e)}
}

function drawDonut(canvasId,segs,total){
  var cv=$(canvasId);if(!cv||!total)return;
  var ctx=cv.getContext('2d'),cx=70,cy=70,rad=58,ir=35;
  ctx.clearRect(0,0,140,140);
  var angle=-Math.PI/2;
  for(var i=0;i<segs.length;i++){
    if(!segs[i].v)continue;
    var sweep=segs[i].v/total*Math.PI*2;
    ctx.beginPath();ctx.arc(cx,cy,rad,angle,angle+sweep);
    ctx.arc(cx,cy,ir,angle+sweep,angle,true);ctx.closePath();
    ctx.fillStyle=segs[i].c;ctx.fill();angle+=sweep;
  }
  ctx.fillStyle='#1a1c18';ctx.font='bold 16px DM Sans';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(total,cx,cy-3);
  ctx.font='9px JetBrains Mono';ctx.fillStyle='#999';ctx.fillText('total',cx,cy+11);
}

function drawDateChart(dateCount){
  var cv=$('dateChart');if(!cv)return;
  var W=cv.width,H2=cv.height,pL=50,pR=15,pT=15,pB=45,cW=W-pL-pR,cH=H2-pT-pB;
  var ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H2);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H2);
  var dates=Object.keys(dateCount).sort();if(!dates.length)return;
  var maxV=0;for(var d=0;d<dates.length;d++)if(dateCount[dates[d]]>maxV)maxV=dateCount[dates[d]];
  for(var g=0;g<=4;g++){
    var y=pT+cH-cH*(g/4);
    ctx.strokeStyle='#ece9e3';ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='9px JetBrains Mono';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(Math.round(maxV*g/4),pL-6,y);
  }
  var bw=Math.max(6,Math.min(28,Math.floor(cW/dates.length)-6));
  for(var d=0;d<dates.length;d++){
    var v=dateCount[dates[d]],bh=Math.round(v/maxV*cH);
    var bx=pL+d*(cW/dates.length)+(cW/dates.length-bw)/2,by=pT+cH-bh;
    var col=v>=3?'#d4930d':v>=2?'#2874a6':'#2d8a32';
    ctx.fillStyle=col;ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#555';ctx.font='bold 10px JetBrains Mono';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(v,bx+bw/2,by-3);
    ctx.save();ctx.translate(bx+bw/2,pT+cH+8);ctx.rotate(-0.5);
    ctx.fillStyle='#999';ctx.font='8px JetBrains Mono';ctx.textAlign='right';ctx.fillText(dates[d],0,0);
    ctx.restore();
  }
}

  try{if(db)dbRef=db}catch(e){}
  /* Approach 2: Try via firebase.database() */
  if(!dbRef){try{dbRef=firebase.database()}catch(e){}}
  /* Approach 3: Try via any global */
  if(!dbRef){try{dbRef=window.db||window.database||window.fbDb}catch(e){}}

  if(dbRef){
    dbRef.ref('ss/inspectionsSync').remove().then(function(){
      notify('Sync cleared. Refreshing...');
      setTimeout(function(){location.reload()},1000);
    }).catch(function(e){

  }
}

function processMassInsp(file){
if(!file)return;
if(typeof XLSX==='undefined')return alert('Excel library still loading.');
var rd=new FileReader();
rd.onload=function(e){
try{
ensureInps();
var wb=XLSX.read(e.target.result,{type:'array'});
var data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
if(data.length<2)return alert('No data rows.');
var headers=data[0].map(function(h){return String(h).toLowerCase().trim()});
var ci={};
var fields=[
  ['id','id'],['start time','startTime'],['start_time','startTime'],
  ['completion time','completionTime'],['completion_time','completionTime'],
  ['date of insp','date'],['date of inspection','date'],['date','date'],['timestamp','date'],
  ['area/zone','area'],['area','area'],
  ['name','name'],['email','email'],
  ['contractor/sub','contractor'],['contractor','contractor'],
  ['discipline','discipline'],['work element','workElement'],
  ['drawing num','drawingNo'],['drawing no','drawingNo'],['drawing','drawingNo'],
  ['requesting to','requestingTo'],
  ['actual site ma','actualSiteMaterial'],['actual site material','actualSiteMaterial'],['actual site','actualSiteMaterial'],
  ['conformance','conformance'],
  ['immediate ac','immediateAction'],['immediate action','immediateAction'],
  ['evaluation re','escalationRequired'],['escalation re','escalationRequired'],['escalation','escalationRequired'],
  ['personality','personResponsible'],['person responsible','personResponsible'],
  ['image','image'],
  ['reviewed by','reviewedBy'],['review by','reviewedBy'],
  ['discussed with','discussedWith'],
  ['remarks','remarks'],['notes','remarks'],
  ['status','status']
];
for(var f=0;f<fields.length;f++){
  for(var h2=0;h2<headers.length;h2++){
    if(headers[h2]===fields[f][0]||headers[h2].indexOf(fields[f][0])===0){
      if(!ci[fields[f][1]])ci[fields[f][1]]=h2;
    }
  }
}
if(!ci.date&&ci.startTime)ci.date=ci.startTime;
if(!ci.date)return alert('No Date column found. Headers: '+headers.join(', '));
var added=0;
for(var r=1;r<data.length;r++){
  var row=data[r];
  if(!row||(!row[ci.date]&&row[ci.date]!==0))continue;
  var dateV=String(row[ci.date]||'');
  if(typeof row[ci.date]==='number'){var dt=new Date((row[ci.date]-25569)*86400000);dateV=dt.getFullYear()+'-'+LZ(dt.getMonth()+1)+'-'+LZ(dt.getDate())}
  else if(dateV.indexOf('T')>0){dateV=dateV.substring(0,10)}
  function gc(field){return ci[field]!==undefined?String(row[ci[field]]||'').trim():''}
  S.inspections.push({
    id:Date.now()+r,formName:'Daily Construction Validation',date:dateV,
    startTime:gc('startTime'),completionTime:gc('completionTime'),
    area:gc('area'),inspector:gc('name'),email:gc('email'),
    contractor:gc('contractor'),discipline:gc('discipline'),
    workElement:gc('workElement'),drawingNo:gc('drawingNo'),
    requestingTo:gc('requestingTo'),actualSiteMaterial:gc('actualSiteMaterial'),
    conformance:gc('conformance'),immediateAction:gc('immediateAction'),
    escalationRequired:gc('escalationRequired'),personResponsible:gc('personResponsible'),
    image:gc('image'),reviewedBy:gc('reviewedBy'),discussedWith:gc('discussedWith'),
    remarks:gc('remarks'),status:gc('status')||'Open',activityType:gc('discipline')
  });
  added++;
}
if(!added)return alert('No valid rows found.');
save();mC();notify('Imported '+added+' inspections');doRender();
}catch(err){alert('Error: '+err.message)}};
rd.readAsArrayBuffer(file);
}

/* --- Delete Member --- */
function delTeamMember(id){
if(!confirm('Delete this team member?'))return;
/* Reassign their reports to the deleted member's manager */
var m=null;
for(var i=0;i<S.teamMembers.length;i++){if(S.teamMembers[i].id===id){m=S.teamMembers[i];break}}
if(m){
  for(var i=0;i<S.teamMembers.length;i++){
    if(String(S.teamMembers[i].reportsTo)===String(id)){
      S.teamMembers[i].reportsTo=m.reportsTo||'';
    }
  }
}
S.teamMembers=S.teamMembers.filter(function(x){return x.id!==id});
save();notify('Deleted');doRender();
}

var aiMessages=[];

R.ai=function(){
if(!aiMessages.length){
  aiMessages.push({role:'ai',text:'Hello! I\'m your Project AI Assistant. I can help you with:\n\n• Task status and progress\n• Budget and cost analysis\n• Inspection summaries\n• Safety metrics\n• Schedule and deadlines\n• Team information\n• Risk alerts\n\nAsk me anything about your project!'})};

var h='<div style="display:flex;flex-direction:column;height:calc(100vh - 160px)">';

/* Header */

  h+='<div style="max-width:80%;padding:10px 14px;border-radius:12px;font-size:.76rem;line-height:1.6;white-space:pre-wrap;'+(isUser?'background:var(--bl);color:#fff;border-bottom-right-radius:4px':'background:var(--s2);color:var(--t1);border-bottom-left-radius:4px')+'">';

function aiSend(){

if(!input)return;
var q=input.value.trim();
if(!q)return;

function aiAsk(q){
aiMessages.push({role:'user',text:q});
doRender();
setTimeout(function(){aiProcess(q)},300);
}

function aiProcess(q){
var ql=q.toLowerCase();
var resp='';

/* Ensure arrays */
if(!Array.isArray(S.tasks))S.tasks=[];
if(!Array.isArray(S.taskProjects))S.taskProjects=[];
if(!Array.isArray(S.inspections))S.inspections=[];
if(!Array.isArray(S.teamMembers))S.teamMembers=[];
if(!Array.isArray(S.userLog))S.userLog=[];

/* Gather data */
var tasks=S.tasks;
var projs=S.taskProjects;
var inps=S.inspections;
var team=S.teamMembers;
var safe=S.safety||{};

var totalTasks=tasks.length;
var doneTasks=0,activeTasks=0,pendingTasks=0,overdueTasks=0;
var today=new Date().toISOString().substring(0,10);
for(var i=0;i<totalTasks;i++){
  var t=tasks[i];
  if(t.st==='done')doneTasks++;
  else if(t.st==='active'){activeTasks++;if(t.e&&t.e<today)overdueTasks++}
  else{pendingTasks++;if(t.e&&t.e<today)overdueTasks++}
}

var siteP=ovProg(tasks);
var siteC=siteCost;
var sitePd=sPaid();
var projC=0,projPd=0;
for(var i=0;i<projs.length;i++){projC+=(projs[i].cost||0);projPd+=pPaid(projs[i])}
var totalC=siteC+projC;
var totalPd=sitePd+projPd;
var balance=totalC-totalPd;
var paidPct=totalC>0?Math.round(totalPd/totalC*100):0;

var totalInps=inps.length;
var confCount=0,revCount=0,nonConfCount=0;
var openInps=0,progInps=0,compInps=0;
for(var i=0;i<totalInps;i++){
  var ins=inps[i];
  var c=ins.conformance||'';
  if(c==='Conforming'||c==='Yes')confCount++;
  else if(c==='For Review')revCount++;
  else nonConfCount++;
  if(ins.status==='Open')openInps++;
  else if(ins.status==='In Progress')progInps++;
  else if(ins.status==='Completed'||ins.status==='Closed')compInps++;
}

var dLTI=dd(safe.startDate||'2026-04-13',today);

/* Project summaries */
var projSumm=[];
for(var i=0;i<projs.length;i++){
  var pj=projs[i];
  var pt=pj.tasks||[];
  var pp=ovProg(pt);
  var pl=pPaid(pj);
  var pc=pj.cost||0;
  projSumm.push({name:pj.name,prog:pp,cost:pc,paid:pl,bal:pc-pl,tasks:pt.length});
}

/* Discipline breakdown */
var discCount={};
for(var i=0;i<totalInps;i++){var d=inps[i].discipline;if(d)discCount[d]=(discCount[d]||0)+1}

/* Contractor breakdown */
var contCount={};
for(var i=0;i<totalInps;i++){var c2=inps[i].contractor;if(c2)contCount[c2]=(contCount[c2]||0)+1}

/* --- RESPONSE LOGIC --- */

/* Project Summary */
if(ql.includes('project summary')||ql.includes('overview')||ql.includes('summary')){
  resp='PROJECT SUMMARY\n\n';
  resp+='Site Progress: '+fmtP(siteP)+'\n';
  resp+='Total Tasks: '+totalTasks+' ('+doneTasks+' done, '+activeTasks+' active, '+pendingTasks+' pending)\n';
  if(overdueTasks>0)resp+='Overdue Tasks: '+overdueTasks+' ⚠️\n';
  resp+='\nSub-Projects: '+projs.length+'\n';
  for(var i=0;i<projSumm.length;i++){
    var ps=projSumm[i];
    resp+='\n  '+ps.name+': '+fmtP(ps.prog)+' complete, '+ps.tasks+' tasks';
  }
  resp+='\n\nBudget: '+fmtD(totalC)+' | Paid: '+fmtD(totalPd)+' ('+paidPct+'%) | Balance: '+fmtD(balance);
  resp+='\nInspections: '+totalInps+' total | Safety: '+dLTI+' days w/o LTI';
}

/* Budget/Cost */
else if(ql.includes('budget')||ql.includes('cost')||ql.includes('money')||ql.includes('paid')||ql.includes('payment')){
  resp='BUDGET STATUS\n\n';
  resp+='Total Contract: '+fmtD(totalC)+'\n';
  resp+='Total Paid: '+fmtD(totalPd)+' ('+paidPct+'%)\n';
  resp+='Balance: '+fmtD(balance)+'\n\n';
  resp+='Breakdown:\n';
  resp+='  Site Master: Contract '+fmtD(siteC)+', Paid '+fmtD(sitePd)+', Bal '+fmtD(siteC-sitePd)+'\n';
  for(var i=0;i<projSumm.length;i++){
    var ps=projSumm[i];
    resp+='  '+ps.name+': Contract '+fmtD(ps.cost)+', Paid '+fmtD(ps.paid)+', Bal '+fmtD(ps.bal)+'\n';
  }
  if(balance>totalC*0.5)resp+='\n⚠️ Alert: More than 50% of budget still unpaid.';
}

/* Overdue */
else if(ql.includes('overdue')||ql.includes('behind')||ql.includes('late')||ql.includes('delay')){
  var overdueList=[];
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i];
    if(t.st!=='done'&&t.e&&t.e<today)overdueList.push(t);
  }
  resp='SCHEDULE STATUS\n\n';
  resp+='Overdue Tasks: '+overdueList.length+'\n';
  if(overdueList.length){
    resp+='\nOverdue items:\n';
    for(var i=0;i<Math.min(overdueList.length,15);i++){
      var od=overdueList[i];
      var daysOver=Math.round((new Date(today)-new Date(od.e))/(1000*60*60*24));
      resp+='  • '+od.wbs+' '+od.name+' (due '+od.e+', '+daysOver+' days ago)\n';
    }
    if(overdueList.length>15)resp+='  ... and '+(overdueList.length-15)+' more\n';
  }else{
    resp+='All tasks are on schedule!';
  }
  for(var i=0;i<projSumm.length;i++){
    var ps=projSumm[i];
    if(ps.prog<30)resp+='\n⚠️ '+ps.name+' is only '+fmtP(ps.prog)+' complete.';
  }
}

/* Safety */
else if(ql.includes('safe')||ql.includes('lti')||ql.includes('incident')||ql.includes('hse')){
  resp='SAFETY REPORT\n\n';
  resp+='Safe Hours: '+(safe.safeHours||0).toLocaleString()+'\n';
  resp+='Days Without LTI: '+dLTI+'\n';
  resp+='Near Misses: '+(safe.nearMisses||0)+'\n';
  resp+='Incidents: '+(safe.incidents||0)+'\n';
  resp+='Safety Starts: '+td()+'\n\n';
  if((safe.nearMisses||0)>10)resp+='⚠️ High near-miss count. Review safety protocols.\n';
  if(dLTI>100)resp+='✅ Excellent safety record.\n';
  resp+='Inspections conducted: '+totalInps+'\n';
  resp+='Conformance rate: '+(totalInps>0?Math.round(confCount/totalInps*100):0)+'%';
}

/* Inspection Summary */
else if(ql.includes('inspection')||ql.includes('conformance')||ql.includes('quality')||ql.includes('validation')){
  resp='INSPECTION SUMMARY\n\n';
  resp+='Total Inspections: '+totalInps+'\n';
  resp+='Conforming: '+confCount+' ('+(totalInps>0?Math.round(confCount/totalInps*100):0)+'%)\n';
  resp+='For Review: '+revCount+'\n';
  resp+='Non-Conforming: '+nonConfCount+'\n\n';
  resp+='Status:\n';
  resp+='  Open: '+openInps+'\n';
  resp+='  In Progress: '+progInps+'\n';
  resp+='  Completed/Closed: '+compInps+'\n\n';
  if(Object.keys(discCount).length){
    resp+='By Discipline:\n';
    for(var dk in discCount)resp+='  '+dk+': '+discCount[dk]+'\n';
  }
  if(Object.keys(contCount).length){
    resp+='\nBy Contractor:\n';
    for(var ck in contCount)resp+='  '+ck+': '+contCount[ck]+'\n';
  }
  if(nonConfCount>0)resp+='\n⚠️ '+nonConfCount+' non-conforming items require corrective action.';
}

/* Risk Alerts */
else if(ql.includes('risk')||ql.includes('alert')||ql.includes('issue')||ql.includes('problem')){
  resp='RISK ALERTS\n\n';
  var alerts=[];
  if(overdueTasks>0)alerts.push('🔴 '+overdueTasks+' overdue task(s) — schedule risk');
  if(nonConfCount>0)alerts.push('🔴 '+nonConfCount+' non-conforming inspection(s) — quality risk');
  if(balance>totalC*0.7)alerts.push('🟡 '+paidPct+'% paid — cash flow may be tight');
  if((safe.nearMisses||0)>5)alerts.push('🟡 '+(safe.nearMisses||0)+' near misses — safety risk');
  for(var i=0;i<projSumm.length;i++){
    if(projSumm[i].prog<20)alerts.push('🟡 '+projSumm[i].name+' only '+fmtP(projSumm[i].prog)+' — may need attention');
  }
  if(openInps>10)alerts.push('🟡 '+openInps+' open inspections — review backlog');
  if(!alerts.length){
    resp+='✅ No major alerts detected. Project is on track.';
  }else{
    resp+=alerts.length+' alert(s) found:\n\n';
    for(var i=0;i<alerts.length;i++)resp+=alerts[i]+'\n';
  }
}

/* Cost Overview */
else if(ql.includes('cost overview')||ql.includes('expense')||ql.includes('financial')){
  resp='COST OVERVIEW\n\n';
  resp+='Total Budget: '+fmtD(totalC)+'\n';
  resp+='Paid to Date: '+fmtD(totalPd)+' ('+paidPct+'%)\n';
  resp+='Outstanding: '+fmtD(balance)+'\n\n';
  var pctC=totalC>0?pct(totalPd,totalC):0;
  resp+='Progress Bar: ';
  var bars=Math.round(pctC/5);
  for(var b=0;b<20;b++)resp+=b<bars?'█':'░';
  resp+=' '+pctC+'%\n\n';
  if(projSumm.length){
    resp+='Per Project:\n';
    for(var i=0;i<projSumm.length;i++){
      var ps=projSumm[i];
      var ppct=ps.cost>0?Math.round(ps.paid/ps.cost*100):0;
      resp+='  '+ps.name+': '+fmtD(ps.paid)+'/'+fmtD(ps.cost)+' ('+ppct+'%)\n';
    }
  }
}

/* Task */
else if(ql.includes('task')||ql.includes('progress')){
  resp='TASK STATUS\n\n';
  resp+='Total: '+totalTasks+'\n';
  resp+='Done: '+doneTasks+' ('+Math.round(doneTasks/Math.max(totalTasks,1)*100)+'%)\n';
  resp+='Active: '+activeTasks+'\n';
  resp+='Pending: '+pendingTasks+'\n';
  if(overdueTasks)resp+='Overdue: '+overdueTasks+' ⚠️\n';
  resp+='\nSite Progress: '+fmtP(siteP)+'\n';
  if(projs.length){
    resp+='\nSub-Projects:\n';
    for(var i=0;i<projSumm.length;i++){
      resp+='  '+projSumm[i].name+': '+fmtP(projSumm[i].prog)+' ('+projSumm[i].tasks+' tasks)\n';
    }
  }
}

/* Team */
else if(ql.includes('team')||ql.includes('member')||ql.includes('staff')||ql.includes('people')){
  resp='TEAM\n\n';
  resp+='Total Members: '+team.length+'\n\n';
  var teamDepts={};
  for(var i=0;i<team.length;i++){
    var d=team[i].department||'Unassigned';
    teamDepts[d]=(teamDepts[d]||0)+1;
  }
  for(var dk in teamDepts)resp+=dk+': '+teamDepts[dk]+' member(s)\n';
  resp+='\nMembers:\n';
  for(var i=0;i<team.length;i++){
    resp+='  '+team[i].name+(team[i].role?' — '+team[i].role:'')+'\n';
  }
}

/* Gantt / Schedule */
else if(ql.includes('gantt')||ql.includes('schedule')||ql.includes('timeline')||ql.includes('deadline')){
  resp='SCHEDULE OVERVIEW\n\n';
  var earliest='',latest='';
  for(var i=0;i<tasks.length;i++){
    if(tasks[i].s&&(!earliest||tasks[i].s<earliest))earliest=tasks[i].s;
    if(tasks[i].e&&(!latest||tasks[i].e>latest))latest=tasks[i].e;
  }
  resp+='Project Start: '+(earliest||'Not set')+'\n';
  resp+='Project End: '+(latest||'Not set')+'\n';
  resp+='Today: '+today+'\n\n';
  if(earliest&&latest){
    var totalDays=dd(earliest,latest);
    var elapsed=dd(earliest,today);
    var timePct=totalDays>0?Math.min(100,Math.round(elapsed/totalDays*100)):0;
    resp+='Time Elapsed: '+elapsed+' of '+totalDays+' days ('+timePct+'%)\n';
    resp+='Work Progress: '+fmtP(siteP)+'\n';
    if(siteP<timePct-10)resp+='⚠️ Work progress ('+fmtP(siteP)+') is behind time progress ('+timePct+'%)\n';
    else if(siteP>timePct+10)resp+='✅ Work is ahead of schedule!\n';
    else resp+='✅ Work and time are aligned.\n';
  }
  if(overdueTasks>0)resp+='\n'+overdueTasks+' task(s) past deadline.';
}

/* Help */
else if(ql.includes('help')||ql.includes('what can')||ql.includes('how to')){
  resp='I can help you with:\n\n';
  resp+='• "Project Summary" — overview of everything\n';
  resp+='• "Budget Status" — cost and payment details\n';
  resp+='• "Overdue Tasks" — what\'s behind schedule\n';
  resp+='• "Safety Report" — LTI days, near misses\n';
  resp+='• "Inspection Summary" — quality check results\n';
  resp+='• "Risk Alerts" — things that need attention\n';
  resp+='• "Cost Overview" — financial dashboard\n';
  resp+='• "Task Status" — progress breakdown\n';
  resp+='• "Team" — team members and departments\n';
  resp+='• "Schedule" — timeline vs progress\n\n';
  resp+='Or ask any question about your project in natural language!';
}

/* Conversational */
else if(ql.includes('hello')||ql.includes('hi')||ql.includes('hey')){
  resp='Hello! How can I help you today? Try asking about your project summary, budget, tasks, or inspections.';
}
else if(ql.includes('thank')){
  resp='You\'re welcome! Let me know if you need anything else.';
}

/* Fallback — try to match keywords */
else{
  var matched=false;

  if(ql.includes('how many')&&ql.includes('task')){
    resp='Total tasks: '+totalTasks+'\nDone: '+doneTasks+'\nActive: '+activeTasks+'\nPending: '+pendingTasks;
    matched=true;
  }
  if(ql.includes('how many')&&ql.includes('inspection')){
    resp='Total inspections: '+totalInps+'\nConforming: '+confCount+'\nFor Review: '+revCount+'\nNon-Conforming: '+nonConfCount;
    matched=true;
  }
  if(ql.includes('how many')&&ql.includes('project')){
    resp='Sub-projects: '+projs.length+'\nSite (Master) + '+projs.length+' projects = '+(projs.length+1)+' total';
    matched=true;
  }
  if(ql.includes('total')&&ql.includes('cost')){
    resp='Total Contract: '+fmtD(totalC)+'\nTotal Paid: '+fmtD(totalPd)+'\nBalance: '+fmtD(balance);
    matched=true;
  }
  if(ql.includes('progress')){
    resp='Overall Site Progress: '+fmtP(siteP)+'\n\n';
    for(var i=0;i<projSumm.length;i++){
      resp+=projSumm[i].name+': '+fmtP(projSumm[i].prog)+'\n';
    }
    matched=true;
  }

  /* Try matching project names */
  for(var i=0;i<projSumm.length;i++){
    if(ql.includes(projSumm[i].name.toLowerCase())){
      var ps=projSumm[i];
      resp=ps.name.toUpperCase()+'\n\n';
      resp+='Progress: '+fmtP(ps.prog)+'\n';
      resp+='Tasks: '+ps.tasks+'\n';
      resp+='Contract: '+fmtD(ps.cost)+'\n';
      resp+='Paid: '+fmtD(ps.paid)+' ('+(ps.cost>0?Math.round(ps.paid/ps.cost*100):0)+'%)\n';
      resp+='Balance: '+fmtD(ps.bal);
      matched=true;
      break;
    }
  }

  if(!matched){
    resp='I\'m not sure how to answer that. Try one of these:\n\n';
    resp+='• Project Summary\n• Budget Status\n• Overdue Tasks\n';
    resp+='• Safety Report\n• Inspection Summary\n• Risk Alerts\n';
    resp+='• Schedule\n• Team\n\n';
    resp+='Or ask a specific question like:\n';
    resp+='"How many tasks are overdue?"\n';
    resp+='"What is the total cost?"\n';
    resp+='"Show me inspection results"';
  }
}

aiMessages.push({role:'ai',text:resp});
doRender();
}
</script>

</html>
