<script>

function addD(ds,n){if(!ds)return '';var d=new Date(ds+'T12:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+LZ(d.getMonth()+1)+'-'+LZ(d.getDate())}

function subtreeProg(arr,wbs){var ch=[];for(var i=0;i<arr.length;i++){var w=arr[i].wbs;if(w!==wbs&&w.indexOf(wbs+'.')===0){var rest=w.substring(wbs.length+1);if(rest.indexOf('.')===-1)ch.push(i)}}if(!ch.length){for(var i=0;i<arr.length;i++)if(arr[i].wbs===wbs)return arr[i].prog;return 0}var t=0;for(var i=0;i<ch.length;i++)t+=subtreeProg(arr,arr[ch[i]].wbs);return Math.round(t/ch.length)}
