function calcCurve(months,m2,tDur,sc){
var tasks=[];
var outdoor=['Earthwork','Construction','Temp','Site','Infrastructure','Buildings','Closeout','MEP'];
for(var j=0;j<m2.length;j++){
  var t=m2[j];
  if(!t.s||!t.e||!t.dur)continue;
  var s=t.s,e=t.e,d=t.dur;
  if(sc!=='baseline'){
    if(sc==='weather'&&outdoor.indexOf(t.cat)>=0){s=addD(s,5);e=addD(e,25);d=dd(s,e)}
    if(sc==='resource'){e=addD(e,Math.round(d*.3));d=dd(s,e)}
    if(sc==='permitDelay'&&t.cat==='Permits'){s=addD(s,10);e=addD(e,30);d=dd(s,e)}
    if(sc==='combined'){
      if(t.cat==='Permits'){s=addD(s,10);e=addD(e,30)}
      if(outdoor.indexOf(t.cat)>=0){s=addD(s,5);e=addD(e,25)}
      e=addD(e,Math.round(dd(s,e)*.15));d=dd(s,e);
    }
  }
  tasks.push({s:s,e:e,d:d});
}
var dur=0;
for(var j=0;j<tasks.length;j++)dur+=tasks[j].d;
if(dur<=0)return months.map(function(){return 0});
var r=[];
for(var mi=0;mi<months.length;mi++){
  var mp=0,me=months[mi].end;
  for(var j=0;j<tasks.length;j++){
    var t=tasks[j],ts=new Date(t.s+'T12:00'),te=new Date(t.e+'T12:00'),w=t.d/dur;
    if(me>=te)mp+=w;
    else if(me>=ts&&te>ts)mp+=w*((me-ts)/(te-ts));
  }
  r.push(Math.round(mp*100));
}
return r;
}

function calcAct(months,oa){
var el=Math.max(dd('2026-01-01',td()),1);
var sp=dd('2026-01-01','2027-02-28');
var ep=el/sp;
var vel=ep>0?oa/(ep*100):1;
var r=[];
for(var mi=0;mi<14;mi++){
  var f=(mi+1)/14;
  if(f<=ep)r.push(Math.min(100,Math.round(oa*(f/ep))));
  else{
    var last=r.length?r[r.length-1]:oa;
    var rf=(f-ep)/(1-ep);
    r.push(Math.min(100,Math.round(last+(100-last)*Math.min(vel*1.2,1)*rf)));
  }
}
return r;
}

function drawSC(months,lines,yMax,yFmt){
var cv=$('scCV');
if(!cv)return;
var W=cv.width,H2=cv.height,pL=60,pR=25,pT=30,pB=50,cW=W-pL-pR,cH=H2-pT-pB;
var ctx=cv.getContext('2d'),n=months.length;
ctx.clearRect(0,0,W,H2);
ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H2);
for(var i=0;i<=10;i++){
  var y=pT+(cH/10)*i;
  ctx.strokeStyle='#ece9e3';ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
  ctx.fillStyle='#999';ctx.font='10px JetBrains Mono';ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillText(yFmt(yMax-(yMax/10)*i),pL-8,y);
}
for(var i=0;i<n;i+=2){
  ctx.fillStyle='#999';ctx.font='9px JetBrains Mono';ctx.textAlign='center';
  ctx.fillText(months[i].label,pL+(cW/(n-1))*i,H2-pB+16);
}
function px(i){return pL+(cW/(n-1))*i}
function py(v){return pT+cH-Math.max(0,Math.min(yMax,v)/yMax*cH)}
var tFrac=(new Date()-new Date(2026,0,1))/(new Date(2027,1,28)-new Date(2026,0,1));
if(tFrac>0&&tFrac<1){
  var tx=pL+cW*tFrac;
  ctx.strokeStyle='rgba(204,51,51,.4)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(tx,pT);ctx.lineTo(tx,pT+cH);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#cc3333';ctx.font='bold 9px JetBrains Mono';ctx.textAlign='center';
  ctx.fillText('TODAY',tx,pT-4);
}
/* Legend */
var lx=pL+10,ly=pT-12;
for(var li=0;li<lines.length;li++){
  var ln=lines[li];
  ctx.fillStyle=ln.color;ctx.font='bold 8px JetBrains Mono';ctx.textAlign='left';
  ctx.beginPath();
  if(ln.dash){ctx.setLineDash(ln.dash)}
  else{ctx.setLineDash([])}
  ctx.strokeStyle=ln.color;ctx.lineWidth=2;
  ctx.moveTo(lx,ly);ctx.lineTo(lx+18,ly);ctx.stroke();ctx.setLineDash([]);
  ctx.fillText(ln.label,lx+22,ly+3);
  lx+=ctx.measureText(ln.label).width+38;
}
for(var li=0;li<lines.length;li++){
  var ln=lines[li];
  ctx.beginPath();ctx.strokeStyle=ln.color;ctx.lineWidth=ln.width||2;
  if(ln.dash)ctx.setLineDash(ln.dash);
  else ctx.setLineDash([]);
  var st=false;
  for(var i=0;i<n;i++){
    if(ln.data[i]==null){st=false;continue}
    if(!st){ctx.moveTo(px(i),py(ln.data[i]));st=true}
    else ctx.lineTo(px(i),py(ln.data[i]));
  }
  ctx.stroke();ctx.setLineDash([]);
}
}

function runSim(){

  months.push({label:new Date(yr,mo,1).toLocaleString('en',{month:'short',year:'2-digit'}),end:new Date(yr,mo+1,0)});
}
var bl=calcCurve(months,m,tDur,'baseline');
var outdoor=['Earthwork','Construction','Temp','Site','Infrastructure','Buildings','Closeout','MEP'];
var runs=200;
var completionMonths=[];
for(var run=0;run<runs;run++){
  var shift=0;
  for(var i=0;i<m.length;i++){
    var t=m[i];
    if(outdoor.indexOf(t.cat)>=0)shift+=Math.random()*0.4;
    if(t.dur>=45)shift+=Math.random()*0.3;
    if(t.cat==='Permits')shift+=Math.random()*0.6;
    shift+=Math.random()*0.1;
  }
  shift=Math.min(5,shift);
  var completionMo=13;
  for(var mi=0;mi<14;mi++){
    var srcMi=Math.max(0,Math.round(mi-shift));
    var adjP=bl[Math.min(srcMi,13)]||0;
    if(adjP>=95){completionMo=mi;break}
  }
  completionMonths.push(completionMo);
}
var hist=[];
for(var i=0;i<14;i++)hist[i]=0;
for(var i=0;i<completionMonths.length;i++)hist[completionMonths[i]]++;
var maxH=0;
for(var i=0;i<14;i++)if(hist[i]>maxH)maxH=hist[i];
completionMonths.sort(function(a,b){return a-b});
var p50=completionMonths[Math.floor(runs*0.5)];

  h+='<span style="font-family:JetBrains Mono;font-size:.48rem;color:#fff">'+hist[i]+'</span>';

  var labels=[];

  if(labels.length)h+='<span style="font-size:.5rem;color:'+barCol+';font-family:JetBrains Mono;font-weight:700">'+labels.join('+')+'</span>';
  h+='</div>';
}
h+='</div>';

var pCards=[
  {label:'P50',month:months[p50].label,color:'var(--g)',desc:'50% probability'},

for(var pi=0;pi<pCards.length;pi++){

function impTasks(input){
  var f=input.files[0];
  if(!f)return;
  if(typeof XLSX==='undefined'){alert('XLSX library not loaded');return}

  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{header:1});

      if(data.length<2){alert('File is empty or has no data rows.');return}

      /* Find header row */
      var hdrRow=-1;
      for(var r=0;r<Math.min(5,data.length);r++){
        var row=data[r];
        if(!row)continue;
        for(var c=0;c<row.length;c++){
          var cell=String(row[c]||'').toLowerCase().trim();
          if(cell==='wbs'||cell==='wbs no'||cell==='wbs#'){hdrRow=r;break}
        }
        if(hdrRow>=0)break;
      }
      if(hdrRow<0){alert('Cannot find header row. Make sure column A header is "WBS".');return}

      var hdr=data[hdrRow];
      var colMap={};
      for(var c=0;c<hdr.length;c++){
        var h=String(hdr[c]||'').toLowerCase().trim();
        if(h==='wbs'||h==='wbs no'||h==='wbs#')colMap.wbs=c;
        else if(h==='name'||h==='task'||h==='task name'||h==='description')colMap.name=c;
        else if(h==='category'||h==='cat')colMap.cat=c;
        else if(h==='duration'||h==='dur'||h==='days')colMap.dur=c;
        else if(h==='start'||h==='start date')colMap.s=c;
        else if(h==='end'||h==='end date'||h==='finish')colMap.e=c;
        else if(h==='progress'||h==='prog'||h==='%')colMap.prog=c;
        else if(h==='wt%'||h==='wt'||h==='weight')colMap.wt=c;
        else if(h==='predecessor'||h==='pred')colMap.pred=c;
        else if(h==='assignee'||h==='assigned')colMap.assignee=c;
      }

      if(colMap.wbs===undefined){alert('Column "WBS" not found. Check header row.');return}
      if(colMap.name===undefined){alert('Column "Name" not found. Check header row.');return}

      /* Parse rows */
      var newTasks=[];
      var errors=[];
      for(var r=hdrRow+1;r<data.length;r++){
        var row=data[r];
        if(!row||!row.length)continue;
        var wbs=String(row[colMap.wbs]||'').trim();
        var name=String(row[colMap.name]||'').trim();
        if(!wbs||!name)continue;

        var cat=colMap.cat!==undefined?String(row[colMap.cat]||'').trim():'General';
        if(!cat)cat='General';

        var s=colMap.s!==undefined?String(row[colMap.s]||'').trim():'';
        var e=colMap.e!==undefined?String(row[colMap.e]||'').trim():'';

        /* Fix date format - handle Excel serial dates */
        s=impFixDate(s);
        e=impFixDate(e);

        var dur=0;
        if(colMap.dur!==undefined){
          dur=parseInt(row[colMap.dur])||0;
        }
        if(!dur&&s&&e){
          dur=dd(s,e);
        }
        if(!dur)dur=14;

        var prog=colMap.prog!==undefined?(parseInt(row[colMap.prog])||0):0;
        var wt=colMap.wt!==undefined?(parseFloat(row[colMap.wt])||0):0;
        var pred=colMap.pred!==undefined?String(row[colMap.pred]||'').trim():'';
        var assignee=colMap.assignee!==undefined?String(row[colMap.assignee]||'').trim():'';

        newTasks.push({
          wbs:wbs,
          name:name,
          cat:cat,
          dur:dur,
          s:s,
          e:e,
          prog:prog,
          st:aSt(prog),
          wt:wt,
          pred:pred,
          assignee:assignee,
          remarks:[]
        });
      }

      if(newTasks.length===0){alert('No valid tasks found in file.');return}

      /* Show preview */
      impShowPreview(newTasks,errors);

    }catch(err){
      alert('Error reading file: '+err.message);
    }
  };
  rd.readAsArrayBuffer(f);
}

function impFixDate(val){
  if(!val)return '';
  val=String(val).trim();
  /* Already YYYY-MM-DD */
  if(/^\d{4}-\d{2}-\d{2}$/.test(val))return val;
  /* Excel serial number */
  if(/^\d{5,}$/.test(val)){
    var d=new Date((parseInt(val)-25569)*86400000);
    return d.getFullYear()+'-'+LZ(d.getMonth()+1)+'-'+LZ(d.getDate());
  }
  /* MM/DD/YYYY or DD/MM/YYYY */
  var parts=val.split(/[\/\-\.]/);
  if(parts.length===3){
    var p0=parseInt(parts[0]),p1=parseInt(parts[1]),p2=parseInt(parts[2]);
    if(p2>1900){return p2+'-'+LZ(p0)+'-'+LZ(p1)}
    else if(p0>1900){return p0+'-'+LZ(p1)+'-'+LZ(p2)}
  }
  return val;
}

  window._impTasks=newTasks;
  mO('Import Preview',bd,'<button class="btn" onclick="mC();window._impTasks=null">Cancel</button><button class="btn bp" onclick="impReplaceMode()">Replace All</button>');
}

function impReplaceMode(){
  if(!window._impTasks)return;
  if(!confirm('Replace all '+S.tasks.length+' current tasks with '+window._impTasks.length+' imported tasks?\n\nThis cannot be undone.'))return;

  S.tasks=window._impTasks;
  sortTasks(S.tasks);
  save();
  try{if(typeof db!=='undefined'&&db)db.ref('ss/tasks').set(S.tasks)}catch(e){}
  mC();
  window._impTasks=null;
  notify('Imported '+S.tasks.length+' tasks');
  doRender();
}

function impAddMode(){
  if(!window._impTasks)return;
  var newTasks=window._impTasks;
  var existWbs={};
  for(var i=0;i<S.tasks.length;i++)existWbs[S.tasks[i].wbs]=true;

  var added=0,skipped=0;
  for(var i=0;i<newTasks.length;i++){
    if(existWbs[newTasks[i].wbs]){
      skipped++;
    }else{
      S.tasks.push(newTasks[i]);
      added++;
    }
  }

  sortTasks(S.tasks);
  save();
  try{if(typeof db!=='undefined'&&db)db.ref('ss/tasks').set(S.tasks)}catch(e){}
  mC();
  window._impTasks=null;
  notify('Added '+added+' tasks ('+skipped+' skipped)');
  doRender();
}

var selectedInps=[];
var inspReady=false;
var syncedInps=[];

function ensureInps(){
  /* Convert object to array if Firebase broke it */
  if(S.inspections&&!Array.isArray(S.inspections)){
    var arr=[];
    for(var k in S.inspections){if(S.inspections[k])arr.push(S.inspections[k])}
    S.inspections=arr;
  }
  if(!Array.isArray(S.inspections))S.inspections=[];
  /* Filter out deleted items */
  var clean=[];
  for(var i=0;i<S.inspections.length;i++){
    var ins=S.inspections[i];if(!ins)continue;
    var did=ins.id||('d_'+Date.now()+'_'+i);
    if(deletedInspIds.indexOf(did)>=0)continue;
    clean.push(ins);
  }
  S.inspections=clean;
  /* Dedupe by ID only */
  if(!inspReady){
    var seen={},deduped=[];
    for(var i=0;i<S.inspections.length;i++){
      var ins2=S.inspections[i];
      var id=ins2.id;
      if(!id){ins2.id=Date.now()+i;id=ins2.id}
      if(!seen[id]){seen[id]=1;deduped.push(ins2)}
    }
    S.inspections=deduped;
    inspReady=true;
  }
}

/* --- Real-time listener for Power Automate sync --- */
function startInspSync(){
  if(!db)return;
  try{var _d=localStorage.getItem('ss_del_insp');if(_d)deletedInspIds=JSON.parse(_d)}catch(e){}
  try{
    db.ref('ss/inspectionsSync').on('value',function(snap){
      var val=snap.val();
      if(!val)return;
      ensureInps();
      var existMap={};
      for(var i=0;i<S.inspections.length;i++){
        existMap[S.inspections[i].id]=true;
      }
      var added=0;
      for(var key in val){
        if(!val[key]||typeof val[key]!=='object')continue;
        var item=val[key];
        if(!item.id)item.id='sync_'+key;
        if(existMap[item.id])continue;
        if(deletedInspIds.indexOf(item.id)>=0)continue;
        S.inspections.push(item);
        existMap[item.id]=true;
        added++;
      }
      if(added){
        inspReady=false;
        save();
        notify(added+' new inspection(s) synced');
        if(tab==='insp')doRender();
      }
    });
  }catch(e){console.log('Sync err:',e)}
}

function drawDonut(canvasId,segs,total){
  var cv=$(canvasId);if(!cv||!total)return;
  var ctx=cv.getContext('2d'),cx=70,cy=70,rad=58,ir=35;
  ctx.clearRect(0,0,140,140);
  var angle=-Math.PI/2;
  for(var i=0;i<segs.length;i++){
    if(!segs[i].v)continue;
    var sweep=segs[i].v/total*Math.PI*2;
    ctx.beginPath();ctx.arc(cx,cy,rad,angle,angle+sweep);
    ctx.arc(cx,cy,ir,angle+sweep,angle,true);ctx.closePath();
    ctx.fillStyle=segs[i].c;ctx.fill();angle+=sweep;
  }
  ctx.fillStyle='#1a1c18';ctx.font='bold 16px DM Sans';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(total,cx,cy-3);
  ctx.font='9px JetBrains Mono';ctx.fillStyle='#999';ctx.fillText('total',cx,cy+11);
}

function drawDateChart(dateCount){
  var cv=$('dateChart');if(!cv)return;
  var W=cv.width,H2=cv.height,pL=50,pR=15,pT=15,pB=45,cW=W-pL-pR,cH=H2-pT-pB;
  var ctx=cv.getContext('2d');ctx.clearRect(0,0,W,H2);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H2);
  var dates=Object.keys(dateCount).sort();if(!dates.length)return;
  var maxV=0;for(var d=0;d<dates.length;d++)if(dateCount[dates[d]]>maxV)maxV=dateCount[dates[d]];
  for(var g=0;g<=4;g++){
    var y=pT+cH-cH*(g/4);
    ctx.strokeStyle='#ece9e3';ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();
    ctx.fillStyle='#999';ctx.font='9px JetBrains Mono';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(Math.round(maxV*g/4),pL-6,y);
  }
  var bw=Math.max(6,Math.min(28,Math.floor(cW/dates.length)-6));
  for(var d=0;d<dates.length;d++){
    var v=dateCount[dates[d]],bh=Math.round(v/maxV*cH);
    var bx=pL+d*(cW/dates.length)+(cW/dates.length-bw)/2,by=pT+cH-bh;
    var col=v>=3?'#d4930d':v>=2?'#2874a6':'#2d8a32';
    ctx.fillStyle=col;ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#555';ctx.font='bold 10px JetBrains Mono';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(v,bx+bw/2,by-3);
    ctx.save();ctx.translate(bx+bw/2,pT+cH+8);ctx.rotate(-0.5);
    ctx.fillStyle='#999';ctx.font='8px JetBrains Mono';ctx.textAlign='right';ctx.fillText(dates[d],0,0);
    ctx.restore();
  }
}

function undoLastUpload(){
  ensureInps();
  /* Find the most recent batch by timestamp proximity */
  if(!S.inspections.length)return notify('No inspections');
  /* Sort by ID (timestamp) descending to find the latest batch */
  var sorted=S.inspections.slice().sort(function(a,b){return (b.id||0)-(a.id||0)});
  var latestId=sorted[0].id||0;
  /* Group items added within 5 seconds of the latest */
  var batch=[];
  for(var i=0;i<sorted.length;i++){
    if(Math.abs((sorted[i].id||0)-latestId)<5000)batch.push(sorted[i]);
    else break;
  }
  if(batch.length===0)return notify('No recent batch found');
  if(!confirm('Undo last upload? This will remove '+batch.length+' most recently added inspection(s).'))return;
  var batchIds={};
  for(var i=0;i<batch.length;i++)batchIds[batch[i].id]=true;
  S.inspections=S.inspections.filter(function(ins){return !batchIds[ins.id]});
  save();
  try{if(typeof db!=='undefined'&&db)db.ref('ss/inspections').set(S.inspections)}catch(e){}
  notify('Removed '+batch.length+' inspections');
  doRender();
}

  if(!dbRef){try{dbRef=window.db||window.database||window.fbDb}catch(e){}}

  if(dbRef){
    dbRef.ref('ss/inspectionsSync').remove().then(function(){

function processMassInsp(file){
if(!file)return;
if(typeof XLSX==='undefined')return alert('Excel library still loading.');
var rd=new FileReader();
rd.onload=function(e){
try{
ensureInps();
var wb=XLSX.read(e.target.result,{type:'array'});
var data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
if(data.length<2)return alert('No data rows.');
var headers=data[0].map(function(h){return String(h).toLowerCase().trim()});
var ci={};
var fields=[
  ['id','id'],['start time','startTime'],['start_time','startTime'],
  ['completion time','completionTime'],['completion_time','completionTime'],
  ['date of insp','date'],['date of inspection','date'],['date','date'],['timestamp','date'],
  ['area/zone','area'],['area','area'],
  ['name','name'],['email','email'],
  ['contractor/sub','contractor'],['contractor','contractor'],
  ['discipline','discipline'],['work element','workElement'],
  ['drawing num','drawingNo'],['drawing no','drawingNo'],['drawing','drawingNo'],
  ['requesting to','requestingTo'],
  ['actual site ma','actualSiteMaterial'],['actual site material','actualSiteMaterial'],['actual site','actualSiteMaterial'],
  ['conformance','conformance'],
  ['immediate ac','immediateAction'],['immediate action','immediateAction'],
  ['evaluation re','escalationRequired'],['escalation re','escalationRequired'],['escalation','escalationRequired'],
  ['personality','personResponsible'],['person responsible','personResponsible'],
  ['image','image'],
  ['reviewed by','reviewedBy'],['review by','reviewedBy'],
  ['discussed with','discussedWith'],
  ['remarks','remarks'],['notes','remarks'],
  ['status','status']
];
for(var f=0;f<fields.length;f++){
  for(var h2=0;h2<headers.length;h2++){
    if(headers[h2]===fields[f][0]||headers[h2].indexOf(fields[f][0])===0){
      if(!ci[fields[f][1]])ci[fields[f][1]]=h2;
    }
  }
}
if(!ci.date&&ci.startTime)ci.date=ci.startTime;
if(!ci.date)return alert('No Date column found. Headers: '+headers.join(', '));
var added=0;
for(var r=1;r<data.length;r++){
  var row=data[r];
  if(!row||(!row[ci.date]&&row[ci.date]!==0))continue;
  var dateV=String(row[ci.date]||'');
  if(typeof row[ci.date]==='number'){var dt=new Date((row[ci.date]-25569)*86400000);dateV=dt.getFullYear()+'-'+LZ(dt.getMonth()+1)+'-'+LZ(dt.getDate())}
  else if(dateV.indexOf('T')>0){dateV=dateV.substring(0,10)}
  function gc(field){return ci[field]!==undefined?String(row[ci[field]]||'').trim():''}
  S.inspections.push({
    id:Date.now()+r,formName:'Daily Construction Validation',date:dateV,
    startTime:gc('startTime'),completionTime:gc('completionTime'),
    area:gc('area'),inspector:gc('name'),email:gc('email'),
    contractor:gc('contractor'),discipline:gc('discipline'),
    workElement:gc('workElement'),drawingNo:gc('drawingNo'),
    requestingTo:gc('requestingTo'),actualSiteMaterial:gc('actualSiteMaterial'),
    conformance:gc('conformance'),immediateAction:gc('immediateAction'),
    escalationRequired:gc('escalationRequired'),personResponsible:gc('personResponsible'),
    image:gc('image'),reviewedBy:gc('reviewedBy'),discussedWith:gc('discussedWith'),
    remarks:gc('remarks'),status:gc('status')||'Open',activityType:gc('discipline')
  });
  added++;
}
if(!added)return alert('No valid rows found.');
save();mC();notify('Imported '+added+' inspections');doRender();
}catch(err){alert('Error: '+err.message)}};
rd.readAsArrayBuffer(file);
}

function phGetWeek(dateStr){
if(!dateStr)return 'Unknown Week';
try{var d=new Date(dateStr+'T12:00');var start=new Date(d.getFullYear(),0,1);var wk=Math.ceil(((d-start)/86400000+start.getDay()+1)/7);return d.getFullYear()+'-W'+(wk<10?'0':'')+wk}catch(e){return 'Unknown Week'}
}

function phCountThisWeek(){
var cw=phGetWeek(td());var c=0;
for(var i=0;i<S.photos.length;i++){if(S.photos[i].week===cw)c++}
return c;
}

function phProcMulti(files){
if(!files||!files.length)return;
window._phQueue=[];window._phIdx=0;window._phProcessed=[];
for(var i=0;i<files.length;i++){
  var f=files[i];
  if(f.type.indexOf('image')===0||f.type.indexOf('video')===0)window._phQueue.push(f);
}
if(window._phQueue.length===0)return;
phProcNext();
}

function phProcNext(){
if(window._phIdx>=window._phQueue.length)return;
var f=window._phQueue[window._phIdx];
if(f.type.indexOf('video')===0){
  phProcVideo(f,function(r){window._phProcessed.push(r);window._phIdx++;if(window._phIdx<window._phQueue.length)phProcNext();else phShowSaveDialog()});
}else{
  var rd=new FileReader();
  rd.onerror=function(){window._phIdx++;phProcNext()};
  rd.onload=function(e){
    var img=new Image();
    img.onerror=function(){window._phIdx++;phProcNext()};
    img.onload=function(){
      var c=document.createElement('canvas');
      var w=img.width,h2=img.height,mx=1000;
      if(w>mx){h2=Math.round(h2*mx/w);w=mx}
      c.width=w;c.height=h2;
      c.getContext('2d').drawImage(img,0,0,w,h2);
      var full=c.toDataURL('image/jpeg',0.6);
      var ct=document.createElement('canvas');
      var tw=300,th=Math.round(img.height*tw/img.width);
      ct.width=tw;ct.height=th;
      ct.getContext('2d').drawImage(img,0,0,tw,th);
      var thumb=ct.toDataURL('image/jpeg',0.5);
      window._phProcessed.push({isVideo:false,data:full,thumb:thumb});
      window._phIdx++;
      if(window._phIdx<window._phQueue.length)phProcNext();
      else phShowSaveDialog();
    };
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}
}

function phProcVideo(f,cb){
var video=document.createElement('video');
video.preload='metadata';video.muted=true;video.playsInline=true;
video.onloadedmetadata=function(){
  var dur=video.duration;
  video.currentTime=0.1;
  video.onseeked=function(){
    var ct=document.createElement('canvas');
    ct.width=Math.min(video.videoWidth,640);
    ct.height=Math.round(video.videoHeight/video.videoWidth*ct.width);
    ct.getContext('2d').drawImage(video,0,0,ct.width,ct.height);
    var thumb=ct.toDataURL('image/jpeg',0.7);
    var rd=new FileReader();
    rd.onload=function(e){cb({isVideo:true,data:e.target.result,thumb:thumb,duration:dur,size:f.size})};
    rd.onerror=function(){cb({isVideo:true,data:'',thumb:thumb,duration:dur,size:f.size})};
    rd.readAsDataURL(f);
  };
};
video.onerror=function(){cb({isVideo:true,data:'',thumb:'',duration:0,size:f.size})};
video.src=URL.createObjectURL(f);
}

function safeTogItm(c,i){
var se=document.getElementById('scs_'+c+'_'+i);
if(!se)return;
var te=document.getElementById('sct_'+c+'_'+i);
var ne=document.getElementById('scn_'+c+'_'+i);

if(v===''){
  if(te)te.style.display='none';
  if(ne)ne.style.display='none';
}else{
  if(te)te.style.display='inline-block';
  if(ne)ne.style.display='block';

  else if(v==='Needs Improvement'){if(te)te.value='Unsafe Condition'}
  else if(v==='Unsatisfactory'){if(te)te.value='Unsafe Act'}
}
}

function safeSaveInsp(){
if(!Array.isArray(S.safetyInspections))S.safetyInspections=[];
var items=[],sat=0,ni=0,uns=0,any=false;
for(var c=0;c<safeChecklist.length;c++){
  var cb=document.getElementById('scc_'+c);
  if(!cb||!cb.checked)continue;
  any=true;
  for(var i=0;i<safeChecklist[c].items.length;i++){
    var se=document.getElementById('scs_'+c+'_'+i);
    if(!se)continue;
    var st=se.value;
    if(st==='')continue;
    var te=document.getElementById('sct_'+c+'_'+i);
    var ne=document.getElementById('scn_'+c+'_'+i);
    var itemName=safeChecklist[c].items[i];
    if(itemName==='Others'){
      var oe=document.getElementById('sco_'+c+'_'+i);
      var otherText=oe?oe.value.trim():'';
      if(!otherText){alert('Please specify the other finding in '+safeChecklist[c].cat);return}
      itemName='Other: '+otherText;
    }
    items.push({category:safeChecklist[c].cat,item:itemName,status:st,type:te?te.value:'Observation',note:ne?ne.value.trim():''});
    if(st==='Satisfactory')sat++;
    else if(st==='Needs Improvement')ni++;
    else if(st==='Unsatisfactory')uns++;
  }
}
if(!any){alert('Select at least one category.');return}
if(items.length===0){alert('Set status for at least one item.');return}
var tot=sat+ni+uns;
var pct=tot>0?Math.round(sat/tot*100):0;
var ov='Satisfactory';
if(pct>=80)ov='Satisfactory';
else if(pct>=50)ov='Needs Improvement';
else ov='Unsatisfactory';

var msg='Submit this inspection?\n\n';
msg+='Items found: '+items.length+'\n';
msg+='Satisfactory: '+sat+'\n';
msg+='Needs Improvement: '+ni+'\n';
msg+='Unsatisfactory: '+uns+'\n';
msg+='Score: '+pct+'%\n';
msg+='Overall: '+ov;
if(!confirm(msg))return;

var catsUsed=[];
for(var ci=0;ci<safeChecklist.length;ci++){
  var cb2=document.getElementById('scc_'+ci);
  if(cb2&&cb2.checked)catsUsed.push(safeChecklist[ci].cat);
}
var newInsp={id:Date.now(),date:$('siD').value,area:$('siA').value.trim(),inspector:$('siI').value.trim(),contractor:$('siCo').value.trim(),remarks:$('siR').value.trim(),items:items,overall:ov,satCount:sat,niCount:ni,unsatCount:uns,categories:catsUsed,createdBy:navigator.userAgent.substring(0,30),createdOn:td()};
S.safetyInspections.unshift(newInsp);
save();
try{if(typeof db!=='undefined'&&db)db.ref('ss/safetyInspections').set(S.safetyInspections)}catch(e){}
mC();notify('Submitted');doRender();
}

function safeSaveEdit(idx){
var si=S.safetyInspections[idx];
if(!si)return;
var oldItems=si.items||[];
var items=[],sat=0,ni=0,uns=0;

/* Update existing items */
for(var i=0;i<oldItems.length;i++){
  var se=document.getElementById('eis_'+i);
  var te=document.getElementById('eit_'+i);
  var ne=document.getElementById('ein_'+i);
  if(!se)continue;
  var st=se.value;
  var tp=te?te.value:oldItems[i].type;
  var nt=ne?ne.value.trim():(oldItems[i].note||'');
  items.push({category:oldItems[i].category,item:oldItems[i].item,status:st,type:tp,note:nt});
  if(st==='Satisfactory')sat++;
  else if(st==='Needs Improvement')ni++;
  else if(st==='Unsatisfactory')uns++;
}

/* Add new items */
for(var c=0;c<safeChecklist.length;c++){
  var cb=document.getElementById('eic_'+c);
  if(!cb||!cb.checked)continue;
  for(var i=0;i<safeChecklist[c].items.length;i++){
    var se=document.getElementById('eins_'+c+'_'+i);
    if(!se)continue;
    var st=se.value;
    if(st==='')continue;
    var te=document.getElementById('eint_'+c+'_'+i);
    var ne=document.getElementById('einn_'+c+'_'+i);
    var itemName=safeChecklist[c].items[i];
    if(itemName==='Others'){
      var oe=document.getElementById('eino_'+c+'_'+i);
      var otherText=oe?oe.value.trim():'';
      if(!otherText){alert('Please specify the other finding in '+safeChecklist[c].cat);return}
      itemName='Other: '+otherText;
    }
    items.push({category:safeChecklist[c].cat,item:itemName,status:st,type:te?te.value:'Observation',note:ne?ne.value.trim():''});
    if(st==='Satisfactory')sat++;
    else if(st==='Needs Improvement')ni++;
    else if(st==='Unsatisfactory')uns++;
  }
}

var tot=sat+ni+uns;
var pct=tot>0?Math.round(sat/tot*100):0;
var ov=pct>=80?'Satisfactory':pct>=50?'Needs Improvement':'Unsatisfactory';

var catsUsed=[];
for(var ci=0;ci<safeChecklist.length;ci++){
  var has=false;
  for(var ii=0;ii<items.length;ii++){if(items[ii].category===safeChecklist[ci].cat){has=true;break}}
  if(has)catsUsed.push(safeChecklist[ci].cat);
}

si.date=$('eiD').value;
si.area=$('eiA').value.trim();
si.inspector=$('eiI').value.trim();
si.contractor=$('eiCo').value.trim();
si.remarks=$('eiR').value.trim();
si.items=items;
si.overall=ov;
si.satCount=sat;
si.niCount=ni;
si.unsatCount=uns;
si.categories=catsUsed;

si.updatedOn=td();
save();
try{if(typeof db!=='undefined'&&db)db.ref('ss/safetyInspections').set(S.safetyInspections)}catch(e){}
mC();notify('Updated');doRender();
}

notify('Deleted');doRender();
}

function safeSync(){
  notify('Syncing...');
  try{
    if(typeof db!=='undefined'&&db){
      db.ref('ss/safetyInspections').once('value').then(function(snap){
        var remote=snap.val();
        if(!remote){notify('No remote inspections');return}
        var rArr=Array.isArray(remote)?remote:Object.values(remote);
        var existIds={};
        for(var i=0;i<S.safetyInspections.length;i++){
          if(S.safetyInspections[i].id)existIds[S.safetyInspections[i].id]=true;
        }
        var added=0;
        for(var i=0;i<rArr.length;i++){
          if(rArr[i]&&rArr[i].id&&!existIds[rArr[i].id]){
            S.safetyInspections.push(rArr[i]);
            added++;
          }
        }
        if(added>0){
          S.safetyInspections.sort(function(a,b){return(b.id||0)-(a.id||0)});
          save();
          notify('Merged '+added+' inspection(s)');
        }else{
          notify('Already up to date');
        }
        doRender();
      }).catch(function(err){
        notify('Error: '+err.message);
      });
    }else{
      notify('Firebase not connected');
    }
  }catch(e){
    notify('Sync failed');
  }
}

function downloadJSON(data,filename){
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

var latest=S.reports.length>0?S.reports[0]:null;
var periodFrom='';
var periodTo=td();
if(latest){periodFrom=latest.date}
else{var d=new Date();d.setDate(d.getDate()-14);periodFrom=d.getFullYear()+'-'+LZ(d.getMonth()+1)+'-'+LZ(d.getDate())}
var phase='Construction';
var oa=ovProg(S.tasks);
var bd='<div style="max-height:75vh;overflow-y:auto;padding-right:8px">';
bd+='<div style="padding:10px;background:var(--blc);border-radius:var(--r);margin-bottom:14px;font-size:.66rem">';
bd+='Completion: <b>'+fmtP(oa)+'</b> | Tasks: <b>'+mainT().length+'</b> | Inspections: <b>'+(S.safetyInspections||[]).length+'</b></div>';
bd+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
bd+='<div class="fg"><label class="fl">Report Date</label><input type="date" id="rptDate" value="'+td()+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Report Number</label><input type="number" id="rptNum" value="'+(S.reports.length+1)+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Period From</label><input type="date" id="rptFrom" value="'+periodFrom+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Period To</label><input type="date" id="rptTo" value="'+periodTo+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Current Phase</label><input type="text" id="rptPhase" value="'+H(phase)+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">% Site Completion</label><input type="number" id="rptComp" value="'+Math.round(oa)+'" min="0" max="100" step="0.1" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Prepared By</label><input type="text" id="rptPrep" value="" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Approved By</label><input type="text" id="rptAppr" value="" style="width:100%"></div>';
bd+='</div>';
bd+='<div class="fg" style="margin-top:10px"><label class="fl" style="color:var(--g)">Highlights</label><textarea id="rptHigh" rows="4" style="width:100%"></textarea></div>';
bd+='<div class="fg"><label class="fl" style="color:var(--bl)">Next Steps</label><textarea id="rptNext" rows="4" style="width:100%"></textarea></div>';
bd+='<div class="fg"><label class="fl" style="color:var(--or)">Support Needed</label><textarea id="rptSupport" rows="3" style="width:100%"></textarea></div>';
bd+='<div class="fg"><label class="fl" style="color:var(--rd)">Risks</label><textarea id="rptRisks" rows="4" style="width:100%"></textarea></div>';
bd+='<div class="fg"><label class="fl">Safety Notes</label><textarea id="rptSafe" rows="2" style="width:100%"></textarea></div>';
bd+='</div>';
mO('New Report',bd,'<button class="btn" onclick="mC()">Cancel</button><button class="btn bp" onclick="rptSave(-1)">Submit</button>');
}

function rptSave(idx){
var nm=0,nu=0;
var insps=S.safetyInspections||[];
for(var i=0;i<insps.length;i++){
  var its=insps[i].items||[];
  for(var j=0;j<its.length;j++){
    if(its[j].type==='Near Miss'&&its[j].status!=='Satisfactory')nm++;
    if(its[j].type==='Unsafe Act'&&its[j].status!=='Satisfactory')nu++;
  }
}
var r={id:idx>=0?S.reports[idx].id:Date.now(),date:$('rptDate').value,reportNum:parseInt($('rptNum').value)||1,periodFrom:$('rptFrom').value,periodTo:$('rptTo').value,phase:$('rptPhase').value.trim(),completion:parseFloat($('rptComp').value)||0,preparedBy:$('rptPrep').value.trim(),approvedBy:$('rptAppr').value.trim(),highlights:$('rptHigh').value.trim(),nextSteps:$('rptNext').value.trim(),supportNeeded:$('rptSupport').value.trim(),risks:$('rptRisks').value.trim(),safetyNotes:$('rptSafe').value.trim(),safetyInspCount:insps.length,nearMisses:nm,unsafeActs:nu,safeHours:(S.safety?S.safety.safeHours:0)||0};
if(idx>=0)S.reports[idx]=r;else S.reports.unshift(r);
save();try{if(typeof db!=='undefined'&&db)db.ref('ss/reports').set(S.reports)}catch(e){}
mC();notify(idx>=0?'Updated':'Report created');doRender();
}

function rptEdit(idx){
var r=S.reports[idx];if(!r)return;
var bd='<div style="max-height:75vh;overflow-y:auto;padding-right:8px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
bd+='<div class="fg"><label class="fl">Date</label><input type="date" id="rptDate" value="'+H(r.date)+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Number</label><input type="number" id="rptNum" value="'+(r.reportNum||1)+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Period From</label><input type="date" id="rptFrom" value="'+H(r.periodFrom||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Period To</label><input type="date" id="rptTo" value="'+H(r.periodTo||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Phase</label><input type="text" id="rptPhase" value="'+H(r.phase||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Completion %</label><input type="number" id="rptComp" value="'+(r.completion||0)+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Prepared By</label><input type="text" id="rptPrep" value="'+H(r.preparedBy||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Approved By</label><input type="text" id="rptAppr" value="'+H(r.approvedBy||'')+'" style="width:100%"></div>';
bd+='</div>';
bd+='<div class="fg" style="margin-top:10px"><label class="fl">Highlights</label><textarea id="rptHigh" rows="4" style="width:100%">'+H(r.highlights||'')+'</textarea></div>';
bd+='<div class="fg"><label class="fl">Next Steps</label><textarea id="rptNext" rows="4" style="width:100%">'+H(r.nextSteps||'')+'</textarea></div>';
bd+='<div class="fg"><label class="fl">Support Needed</label><textarea id="rptSupport" rows="3" style="width:100%">'+H(r.supportNeeded||'')+'</textarea></div>';
bd+='<div class="fg"><label class="fl">Risks</label><textarea id="rptRisks" rows="4" style="width:100%">'+H(r.risks||'')+'</textarea></div>';
bd+='<div class="fg"><label class="fl">Safety Notes</label><textarea id="rptSafe" rows="2" style="width:100%">'+H(r.safetyNotes||'')+'</textarea></div>';
bd+='</div>';
mO('Edit Report',bd,'<button class="btn" onclick="mC()">Cancel</button><button class="btn bp" onclick="rptSave('+idx+')">Update</button>');
}

function rptView(idx){var r=S.reports[idx];if(!r)return;mO('Report #'+(r.reportNum||idx+1),rptCard(r),'<button class="btn" onclick="mC()">Close</button>');}

function rptDel(idx){if(!confirm('Delete?'))return;S.reports.splice(idx,1);save();try{if(typeof db!=='undefined'&&db)db.ref('ss/reports').set(S.reports)}catch(e){}notify('Deleted');doRender();}

function rptExport(idx){
var r=S.reports[idx];if(!r)return;
var w=window.open('','_blank');
var oa=r.completion||0;
var d=w.document;
var st=d.createElement('style');
st.textContent='*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,sans-serif;color:#1a1a1a;background:#fff;padding:40px;max-width:900px;margin:0 auto}.hd{background:linear-gradient(135deg,#1a3a5c,#2874a6);color:#fff;padding:30px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.hd h1{font-size:24px}.pt{font-size:36px;font-weight:700}.mt{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ddd;margin-bottom:20px;border-radius:4px;overflow:hidden}.mt div{padding:12px;text-align:center;background:#f8f8f8}.lb{font-size:10px;color:#888;text-transform:uppercase}.vl{font-size:14px;font-weight:700;margin-top:2px}.pb{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:10px 0 20px}.pf{height:100%;background:linear-gradient(90deg,#2874a6,#3498db);border-radius:7px}.sc{padding:16px;margin-bottom:16px;border-radius:6px}.sc h3{font-size:13px;font-weight:700;margin-bottom:8px}.sc p{font-size:13px;line-height:1.8;white-space:pre-wrap}.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}.sg div{padding:10px;border-radius:6px;background:#f5f5f5}.sv{font-size:20px;font-weight:700;display:block;margin-top:4px}.ft{margin-top:20px;padding-top:10px;border-top:1px solid #ddd;font-size:11px;color:#888;display:flex;justify-content:space-between}@media print{body{padding:20px}}';
d.head.appendChild(st);
d.title='Report '+r.date;
d.body.innerHTML='<div class="hd"><div><h1>PROGRESS REPORT</h1><div style="opacity:.8;margin-top:4px">'+H(S.reportConfig.projectName||'')+'</div></div><div style="text-align:right"><div style="opacity:.8">'+H(S.reportConfig.company||'')+'</div><div class="pt">'+fmtP(oa)+'</div><div style="font-size:11px;opacity:.7">Completion</div></div></div><div class="mt"><div><div class="lb">Date</div><div class="vl">'+H(r.date)+'</div></div><div><div class="lb">Period</div><div class="vl">'+H(r.periodFrom||'')+' to '+H(r.periodTo||'')+'</div></div><div><div class="lb">Phase</div><div class="vl">'+H(r.phase)+'</div></div><div><div class="lb">Report #</div><div class="vl">'+(r.reportNum||'')+'</div></div></div><div class="pb"><div class="pf" style="width:'+oa+'%"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px"><div class="sc" style="background:#e8f5e9;border-left:4px solid #2d8a32"><h3 style="color:#2d8a32">HIGHLIGHTS</h3><p>'+H(r.highlights||'None')+'</p></div><div class="sc" style="background:#e3f2fd;border-left:4px solid #2874a6"><h3 style="color:#2874a6">NEXT STEPS</h3><p>'+H(r.nextSteps||'None')+'</p></div><div class="sc" style="background:#fff8e1;border-left:4px solid #d4930d"><h3 style="color:#d4930d">SUPPORT NEEDED</h3><p>'+H(r.supportNeeded||'None')+'</p></div><div class="sc" style="background:#ffebee;border-left:4px solid #cc3333"><h3 style="color:#cc3333">RISKS</h3><p>'+H(r.risks||'None')+'</p></div></div><div style="margin-bottom:16px"><div style="font-weight:600;margin-bottom:8px">Safety</div><div class="sg"><div><div class="lb">Days w/o LTI</div><span class="sv" style="color:#2d8a32">'+dd((S.safety?S.safety.startDate:'')||'2026-04-13',r.date)+'</span></div><div><div class="lb">Inspections</div><span class="sv" style="color:#2874a6">'+(r.safetyInspCount||0)+'</span></div><div><div class="lb">Near Misses</div><span class="sv" style="color:#d4930d">'+(r.nearMisses||0)+'</span></div><div><div class="lb">Unsafe Acts</div><span class="sv" style="color:#cc3333">'+(r.unsafeActs||0)+'</span></div><div><div class="lb">Safe Hours</div><span class="sv" style="color:#2874a6">'+((r.safeHours||0).toLocaleString())+'</span></div></div></div><div class="ft"><div>By: '+H(r.preparedBy||'-')+' | '+H(r.approvedBy||'-')+'</div><div>'+H(r.date)+'</div></div>';
setTimeout(function(){w.print()},500);
}

function rptConfig(){
var cfg=S.reportConfig||{};
var bd='<div class="fg"><label class="fl">Project Name</label><input type="text" id="rcPN" value="'+H(cfg.projectName||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Company</label><input type="text" id="rcCo" value="'+H(cfg.company||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Prepared By</label><input type="text" id="rcPrep" value="'+H(cfg.preparedBy||'')+'" style="width:100%"></div>';
bd+='<div class="fg"><label class="fl">Approved By</label><input type="text" id="rcAppr" value="'+H(cfg.approvedBy||'')+'" style="width:100%"></div>';
mO('Report Settings',bd,'<button class="btn" onclick="mC()">Cancel</button><button class="btn bp" onclick="rptSaveConfig()">Save</button>');
}

function rptSaveConfig(){
S.reportConfig=S.reportConfig||{};
S.reportConfig.projectName=$('rcPN').value.trim();
S.reportConfig.company=$('rcCo').value.trim();
S.reportConfig.preparedBy=$('rcPrep').value.trim();
S.reportConfig.approvedBy=$('rcAppr').value.trim();
save();mC();notify('Saved');doRender();
}
</script>
</body>
</html>
